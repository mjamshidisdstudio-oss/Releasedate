services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: releasedate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-releasedate}
      POSTGRES_DB: releasedate
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasedate"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://releasedate:${POSTGRES_PASSWORD:-releasedate}@db:5432/releasedate
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ random characters)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1405!}
      # Set to "false" only if the site is served over plain HTTP.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
